<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f6f3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.logo{height:80px;width:auto;margin-bottom:2rem}
h1{font-size:15px;font-weight:600;color:#6b6960;text-transform:uppercase;letter-spacing:1px;margin-bottom:2.5rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%;max-width:600px}
.card{background:#fff;border:1px solid #e2e0da;border-radius:14px;padding:28px 24px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:all .18s;cursor:pointer}
.card:hover{border-color:#1a5c38;box-shadow:0 4px 20px rgba(26,92,56,.12);transform:translateY(-2px)}
.card-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.card-icon.green{background:#e8f4ed}
.card-icon.blue{background:#eaf1fb}
.card-title{font-size:16px;font-weight:600;color:#1a1a18}
.card-desc{font-size:12px;color:#9b9890;line-height:1.5}
.card-arrow{font-size:13px;color:#1a5c38;font-weight:600;margin-top:4px}
.footer{margin-top:2.5rem;font-size:11px;color:#b0ae a7;text-align:center}
#version{position:fixed;bottom:10px;right:14px;font-size:10px;color:#9b9890;background:#fff;border:1px solid #e2e0da;border-radius:4px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
</style>
